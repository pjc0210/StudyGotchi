      <circle cx="-12" cy="38" r="14" fill="none" stroke="#766f5d" stroke-width="3.2" stroke-dasharray="15 4 7 5"/>
      <circle cx="-12" cy="38" r="9" fill="#2f7f99" opacity="0.55" stroke="#f5efdc" stroke-width="1"/>
      <g stroke="#b7a981" stroke-width="1.5"><path d="M-33,43 v-13 M-25,53 l2,-15 M8,48 l-1,-14 M15,38 l3,-12"/></g>
      <text x="-12" y="14" font-size="4" text-anchor="middle" font-weight="bold" fill="#fffaf0">4 DROWNED FORUM</text>
      <text x="-12" y="65" font-size="2.6" text-anchor="middle" fill="#fffaf0">mosaic quay + dive steps + 28 m broken ring</text>
      <text x="-12" y="68.5" font-size="2.5" text-anchor="middle" fill="#d9eef0">(-12,+38); 54 x 48 m; jitter 7 x 6; yaw +/-18</text>

