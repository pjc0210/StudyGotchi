      <circle cx="-44" cy="-42" r="3.1" fill="#c64b92"/>
      <text x="-26" y="-77" font-size="4" text-anchor="middle" font-weight="bold" fill="#273e49">1 CLIFF VILLAGE</text>
      <text x="-26" y="-28" font-size="2.6" text-anchor="middle" fill="#273e49">civic stair + white/cyan lanes + vine court</text>
      <text x="-26" y="-24.5" font-size="2.5" text-anchor="middle" fill="#5279a5">(-26,-55); 54 x 48 m; jitter 8 x 6; yaw +/-16</text>

      <!-- D2: dry archaeology -->
      <g stroke="#85785f" stroke-width="1.5" fill="#f5efdc"><path d="M-128,-36 v17 M-121,-38 v19 M-114,-35 v15 M-107,-38 v18 M-100,-34 v14 M-93,-35 v15"/><path d="M-131,-19 H-90"/></g>
