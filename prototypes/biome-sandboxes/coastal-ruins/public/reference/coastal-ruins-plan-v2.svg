      <text x="-112" y="1" font-size="2.6" text-anchor="middle" fill="#273e49">survey yard + cistern + 41 m column comb</text>
      <text x="-112" y="4.5" font-size="2.5" text-anchor="middle" fill="#85785f">(-112,-24); 46 x 44 m; jitter 7 x 6; yaw +/-18</text>

      <!-- D3: island-village colour-block motif, no church/dome -->
      <g fill="none" stroke="#b98762" stroke-width="2.2"><path d="M51,-66 Q71,-77 93,-64"/><path d="M52,-57 Q72,-68 94,-56"/><path d="M56,-48 Q73,-58 91,-48"/></g>
      <g fill="#c88955" stroke="#f5efdc" stroke-width="0.5"><rect x="54" y="-71" width="7" height="6"/><rect x="82" y="-55" width="8" height="6"/></g>
      <circle cx="76" cy="-66" r="4" fill="#5279a5" stroke="#f5efdc" stroke-width="0.8"/>
      <text x="72" y="-82" font-size="4" text-anchor="middle" font-weight="bold" fill="#273e49">3 DRY TERRACES</text>
      <text x="72" y="-32" font-size="2.6" text-anchor="middle" fill="#273e49">ochre yards + kiln + blue cistern; 3 crescents</text>
      <text x="72" y="-28.5" font-size="2.5" text-anchor="middle" fill="#85785f">(+72,-58); 52 x 44 m; jitter 8 x 5; yaw +/-14</text>

