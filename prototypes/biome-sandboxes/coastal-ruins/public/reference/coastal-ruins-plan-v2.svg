      <g fill="none" stroke="#766f5d" stroke-width="3.4" stroke-linecap="square"><path d="M68,29 H96 V45"/><path d="M77,18 V39 H105"/></g>
      <g fill="#fffaf0" stroke="#5279a5" stroke-width="0.5"><rect x="65" y="15" width="10" height="8"/><rect x="92" y="17" width="10" height="8"/><rect x="96" y="39" width="8" height="6"/></g>
      <path d="M65,15 h10 v3 h-10 z M92,17 h10 v3 h-10 z" fill="#5e466f"/>
      <text x="86" y="5" font-size="4" text-anchor="middle" font-weight="bold" fill="#273e49">5 WORKING QUAY + COVE TOWN</text>
      <text x="86" y="55" font-size="2.6" text-anchor="middle" fill="#273e49">shuttered sheds + violet awnings + 32 m L-quay</text>
      <text x="86" y="58.5" font-size="2.5" text-anchor="middle" fill="#85785f">(+86,+30); 50 x 44 m; jitter 8 x 6; yaw +/-16</text>

      <!-- local roads only -->
      <g fill="none" stroke-linecap="round"><path d="M-52,-39 C-48,-31 -46,-24 -45,-17" stroke="#c7b894" stroke-width="4"/><path d="M48,-38 C52,-30 56,-24 60,-19" stroke="#c7b894" stroke-width="4"/><path d="M-131,-8 C-125,-3 -119,0 -111,3" stroke="#c7b894" stroke-width="3"/><path d="M-38,20 l5,4 -5,4 5,4 -5,4" stroke="#f5efdc" stroke-width="2"/></g>

      <!-- landmark headland -->
      <path d="M84,83 L93,77 L111,78 L123,88 L122,104 L112,113 L95,113 L84,103 Z" fill="#b98762" stroke="#f8f2df" stroke-width="0.9"/>
      <path d="M90,88 L98,83 L109,84 L116,91 L115,101 L108,107 L98,107 L91,101 Z" fill="#e8dfc6"/>
      <path d="M98,103 h11 v-9 h-11 z M101,91 h5 v-5 h-5 z" fill="#fffaf0" stroke="#536a75" stroke-width="0.4"/>
      <path d="M104,86 v-7" stroke="#c64b92" stroke-width="1.2"/>
      <text x="104" y="74" font-size="4" text-anchor="middle" font-weight="bold" fill="#fffaf0">L ARCHIVE-BEACON HEADLAND</text>

      <!-- seeded boat routes and protected open water -->
      <g fill="none" stroke="#fffaf0" stroke-width="0.75" stroke-dasharray="3 2"><path d="M101,54 C108,64 108,72 105,79"/><path d="M66,58 C42,76 18,83 -7,79 C-26,76 -42,69 -54,58"/><path d="M-63,78 C-22,104 35,109 85,94"/></g>
      <g fill="none" stroke="#fffaf0" stroke-width="0.35" stroke-dasharray="1 1.2"><ellipse cx="-68" cy="29" rx="15" ry="12"/><ellipse cx="27" cy="-7" rx="14" ry="11"/><ellipse cx="-36" cy="98" rx="17" ry="12"/><ellipse cx="38" cy="89" rx="14" ry="11"/></g>
      <g font-size="2.4" fill="#fffaf0" text-anchor="middle"><text x="-68" y="30">open 30 x 24</text><text x="27" y="-6">open 28 x 22</text><text x="-36" y="99">open sea 34 x 24</text><text x="38" y="90">open sea 28 x 22</text></g>

      <!-- camera-safe frame and fog -->
      <circle cx="0" cy="0" r="86" fill="none" stroke="#273e49" stroke-width="0.35" stroke-dasharray="3 2" opacity="0.7"/>
      <rect x="-139" y="99" width="278" height="23" fill="url(#fogS)"/>
      <rect x="-139" y="-124" width="278" height="246" fill="url(#fogSide)" opacity="0.52"/>
      <path d="M-128,-112 H128 V108 H-128 Z" fill="none" stroke="#273e49" stroke-width="0.45" stroke-dasharray="4 2"/>
      <text x="0" y="112" font-size="2.9" text-anchor="middle" fill="#273e49" font-weight="bold">CAMERA-RELATIVE FOG 118-176 m; 3-STACK BELTS CLOSE W / S / E</text>

      <!-- axes and scale -->
      <g stroke="#273e49" stroke-width="0.5" fill="#273e49"><path d="M-129,116 h20"/><polygon points="-109,114.5 -106,116 -109,117.5"/><path d="M-129,116 v-20"/><polygon points="-130.5,96 -129,93 -127.5,96"/></g>
      <text x="-104" y="117" font-size="2.7" fill="#273e49">+x east</text><text x="-127" y="94" font-size="2.7" fill="#273e49">-z north</text>
      <g transform="translate(50,116)"><rect width="20" height="1.6" fill="#273e49"/><rect x="20" width="20" height="1.6" fill="#fffaf0" stroke="#273e49" stroke-width="0.2"/><text x="0" y="-1" font-size="2.4" fill="#273e49">0</text><text x="20" y="-1" font-size="2.4" fill="#273e49" text-anchor="middle">20</text><text x="40" y="-1" font-size="2.4" fill="#273e49" text-anchor="middle">40 m</text></g>
    </g>
  </g>
  <rect x="8" y="8" width="278" height="246" fill="none" stroke="#273e49" stroke-width="0.65"/>

  <!-- audit and plan legend -->
  <g transform="translate(294,9)" font-size="2.68" fill="#273e49">
    <text x="0" y="5" font-size="5.1" font-weight="bold">coastal-ruins - plan v2</text>
    <text x="0" y="10">hard-audit revision; 1 unit = 1 m; 2026-09-20</text>
    <text x="0" y="14">world 278 x 246 m; overview r 86 m; max camera r 133 m</text>

    <text x="0" y="22" font-size="3.3" font-weight="bold">Concrete v1 corrections</text>
    <text x="0" y="26.5">1. fixed catchments now leave at least 21 m clear</text>
    <text x="0" y="30.5">2. drowned ring enlarged to 28 m with dark 3.2 m stroke</text>
    <text x="0" y="34.5">3. horizon rows now use their drawn z coordinates</text>
    <text x="0" y="38.5">4. refs 01 / 02 / 03 / 04 own different districts</text>

    <text x="0" y="46" font-size="3.3" font-weight="bold">Palette</text>
    <rect x="0" y="48" width="5" height="3.5" fill="#e8dfc6"/><text x="7" y="51">ground #e8dfc6</text>
    <rect x="0" y="53" width="5" height="3.5" fill="#b98762"/><text x="7" y="56">cliff / pedestal side #b98762</text>
    <rect x="0" y="58" width="5" height="3.5" fill="#f5efdc"/><text x="7" y="61">road core / plaster #f5efdc</text>
    <rect x="0" y="63" width="5" height="3.5" fill="#c7b894"/><text x="7" y="66">road edge / ruins #c7b894</text>
    <rect x="0" y="68" width="5" height="3.5" fill="#63bec6"/><text x="7" y="71">wet #63bec6; water #2f7f99</text>
    <rect x="0" y="73" width="5" height="3.5" fill="#5279a5"/><text x="7" y="76">cobalt #5279a5; vine #c64b92</text>

    <text x="0" y="84" font-size="3.3" font-weight="bold">Fixed catchments and clearance</text>
    <text x="0" y="88.5">D1 (-26,-55) 54 x 48; D2 (-112,-24) 46 x 44</text>
    <text x="0" y="92.5">D3 (+72,-58) 52 x 44; D4 (-12,+38) 54 x 48</text>
    <text x="0" y="96.5">D5 (+86,+30) 50 x 44; L (+104,+96) 38 x 34</text>
    <text x="0" y="100.5">five nearest clearances: 23.5 / 27.9 / 21.8 / 21.8 / 28.9 m</text>
    <text x="0" y="104.5">conservative fixed-catchment minimum: 21.7 m</text>

    <text x="0" y="112" font-size="3.3" font-weight="bold">Seed contract</text>
    <text x="0" y="116.5">catchments, coast, headland, skyline foot are fixed</text>
    <text x="0" y="120.5">only anchors / population slots sample dashed envelopes</text>
    <text x="0" y="124.5">yaw D1 16; D2 18; D3 14; D4 18; D5 16 deg</text>
    <text x="0" y="128.5">reject overlap, open width under 20 m, route in channel</text>
    <text x="0" y="132.5">one 8-12 m anchor; support silhouettes 3-7 m</text>

    <text x="0" y="140" font-size="3.3" font-weight="bold">Motif distribution</text>
    <text x="0" y="144.5">01 civic stair + vine -> D1; 02 ochre blocks -> D3</text>
    <text x="0" y="148.5">03 broken columns / ring -> D2 + D4</text>
    <text x="0" y="152.5">04 shutters + violet awnings -> D5</text>
    <text x="0" y="156.5">05 channel + faceted cliff + foam -> whole coast</text>

    <text x="0" y="164" font-size="3.3" font-weight="bold">Camera-safe horizon - 8 azimuths</text>
    <text x="0" y="168.5">N: S stacks; NE: SW stack fan; E: W stack belt</text>
    <text x="0" y="172.5">SE: NW escarpment; S: N escarpment + row 2</text>
    <text x="0" y="176.5">SW: NE escarpment; W: E stack belt; NW: SE fan</text>
    <text x="0" y="180.5">pitch 39 deg; FOV 27 deg; dolly 0.72-1.55x</text>
    <text x="0" y="184.5">fog is camera-relative: starts 118 m; opaque 176 m</text>
    <text x="0" y="188.5">each view: 8 m blocker or 3 overlapping stacks</text>

    <text x="0" y="196" font-size="3.3" font-weight="bold">Skyline progression; ground fixed</text>
    <text x="0" y="200.5">0% 3 shoulders / 8 m; 25% 4 / 10; 50% 6 / 13</text>
    <text x="0" y="204.5">75% 8 / 16 + row 2; 100% 9 / 18 + four 22 m slits</text>

    <text x="0" y="212" font-size="3.3" font-weight="bold">48 px anchors</text>
    <text x="0" y="216.5">D1 stair zigzag; D2 6-tooth comb; D3 3 crescents</text>
    <text x="0" y="220.5">D4 dark broken ring; D5 L-quay; L isolated block</text>
    <text x="0" y="224.5">hidden: tan coast + teal bite + horizontal escarpment</text>
    <text x="0" y="228.5">shown: six non-church / non-temple symbols stay separate</text>

    <text x="0" y="236" font-size="3.3" font-weight="bold">Topic and movement rules</text>
    <text x="0" y="240.5">topics map several-to-one; 2-4 fixed pads per district</text>
    <text x="0" y="244.5">local lanes only; 3 boat routes; no bridge / global spiral</text>
    <text x="0" y="250" fill="#766f5d">V2 keeps broad sea and three reserved open-water fields.</text>
  </g>
</svg>
