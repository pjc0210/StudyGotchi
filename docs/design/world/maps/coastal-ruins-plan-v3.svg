  <rect x="8" y="8" width="278" height="246" fill="none" stroke="#273e49" stroke-width="0.65"/>

  <!-- plan legend -->
  <g transform="translate(294,9)" font-size="2.68" fill="#273e49">
    <text x="0" y="5" font-size="5.1" font-weight="bold">coastal-ruins - plan v3</text>
    <text x="0" y="10">camera-model correction; 1 unit = 1 m; 2026-09-20</text>
    <text x="0" y="14">278 x 246 m crop; world sea continues south beyond crop</text>

    <text x="0" y="22" font-size="3.3" font-weight="bold">V3 correction</text>
    <text x="0" y="26.5">camera is south/front and always looks north/back</text>
    <text x="0" y="30.5">pitch 34-40 deg; yaw only -35 / 0 / +35 deg</text>
    <text x="0" y="34.5">north escarpment is the only skyline horizon</text>
    <text x="0" y="38.5">side wings taper into fog; no front/south stacks</text>
    <text x="0" y="42.5">foreground sea crosses camera and crop; no visible edge</text>

    <text x="0" y="50" font-size="3.3" font-weight="bold">Salt-White palette preserved</text>
    <rect x="0" y="52" width="5" height="3.5" fill="#e8dfc6"/><text x="7" y="55">ground #e8dfc6</text>
    <rect x="0" y="57" width="5" height="3.5" fill="#b98762"/><text x="7" y="60">cliff / pedestal side #b98762</text>
    <rect x="0" y="62" width="5" height="3.5" fill="#f5efdc"/><text x="7" y="65">road core / plaster #f5efdc</text>
    <rect x="0" y="67" width="5" height="3.5" fill="#c7b894"/><text x="7" y="70">road edge / ruins #c7b894</text>
    <rect x="0" y="72" width="5" height="3.5" fill="#63bec6"/><text x="7" y="75">wet #63bec6; water #2f7f99</text>
    <rect x="0" y="77" width="5" height="3.5" fill="#5279a5"/><text x="7" y="80">cobalt #5279a5; vine #c64b92</text>

    <text x="0" y="88" font-size="3.3" font-weight="bold">Fixed districts preserved</text>
    <text x="0" y="92.5">D1 (-26,-55) 54 x 48; D2 (-112,-24) 46 x 44</text>
    <text x="0" y="96.5">D3 (+72,-58) 52 x 44; D4 (-12,+38) 54 x 48</text>
    <text x="0" y="100.5">D5 (+86,+30) 50 x 44; L (+104,+96) 38 x 34</text>
    <text x="0" y="104.5">minimum conservative district clearance: 21.7 m</text>

    <text x="0" y="112" font-size="3.3" font-weight="bold">Camera tests</text>
    <text x="0" y="116.5">default dolly r 86 m; max dolly r 133 m</text>
    <text x="0" y="120.5">target (0,0); FOV 27 deg; pitch test 34 and 40 deg</text>
    <text x="0" y="124.5">yaw -35: north escarpment + west tapered wing</text>
    <text x="0" y="128.5">yaw 0: central escarpment + fixed second row</text>
    <text x="0" y="132.5">yaw +35: north escarpment + east tapered wing</text>
    <text x="0" y="136.5">run all 3 at r 86 and r 133 = 6 required views</text>
    <text x="0" y="140.5">fog starts 210 m from camera; opaque at 310 m</text>

    <text x="0" y="148" font-size="3.3" font-weight="bold">Acceptance per 6 views</text>
    <text x="0" y="152.5">back skyline spans frame behind districts</text>
    <text x="0" y="156.5">near side wing overlaps back row before fog</text>
    <text x="0" y="160.5">far side dissolves; no hard lateral cut appears</text>
    <text x="0" y="164.5">foreground is only sea + fog + crop, never stacks/cliff</text>
    <text x="0" y="168.5">no circular ring, front wall, or south horizon element</text>

    <text x="0" y="176" font-size="3.3" font-weight="bold">Seed and growth unchanged</text>
    <text x="0" y="180.5">fixed catchments / coast / headland / skyline foot</text>
    <text x="0" y="184.5">anchors and population slots jitter inside envelopes</text>
    <text x="0" y="188.5">0% 3 shoulders / 8 m; 25% 4 / 10; 50% 6 / 13</text>
    <text x="0" y="192.5">75% 8 / 16 + row 2; 100% 9 / 18 + four 22 m slits</text>

    <text x="0" y="200" font-size="3.3" font-weight="bold">48 px anchors unchanged</text>
    <text x="0" y="204.5">D1 stair zigzag; D2 6-tooth comb; D3 3 crescents</text>
    <text x="0" y="208.5">D4 dark broken ring; D5 L-quay; L isolated block</text>

    <text x="0" y="216" font-size="3.3" font-weight="bold">Motifs unchanged</text>
    <text x="0" y="220.5">01 stair/vine D1; 02 ochre blocks D3</text>
    <text x="0" y="224.5">03 columns/ring D2+D4; 04 shutters/awnings D5</text>
    <text x="0" y="228.5">05 channel/faceted cliff/foam across whole coast</text>

    <text x="0" y="236" font-size="3.3" font-weight="bold">Open-front rule</text>
    <text x="0" y="240.5">camera may dolly south over sea; land never follows it</text>
    <text x="0" y="244.5">render crop hides near sea extent; fog hides far extent</text>
    <text x="0" y="250" fill="#766f5d">V3 replaces all free-orbit / 8-azimuth requirements.</text>
  </g>
</svg>
