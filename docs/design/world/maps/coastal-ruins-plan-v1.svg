      <g font-size="2.5" fill="#fffaf0"><text x="105" y="45" transform="rotate(74 105 45)">headland skiff</text><text x="26" y="67" transform="rotate(-18 26 67)">ruin-view loop</text><text x="5" y="99">outer boat route - no bridge</text></g>

      <!-- protected negative space -->
      <g fill="none" stroke="#fffaf0" stroke-width="0.35" stroke-dasharray="1 1.2"><ellipse cx="-78" cy="26" rx="15" ry="12"/><ellipse cx="37" cy="-4" rx="14" ry="11"/><ellipse cx="-40" cy="94" rx="17" ry="13"/><ellipse cx="39" cy="83" rx="14" ry="12"/></g>
      <g font-size="2.5" fill="#fffaf0" text-anchor="middle"><text x="-78" y="27">open 30 x 24 m</text><text x="37" y="-3">open 28 x 22 m</text><text x="-40" y="95">open sea 34 x 26 m</text><text x="39" y="84">open sea 28 x 24 m</text></g>

      <circle cx="0" cy="0" r="86" fill="none" stroke="#273e49" stroke-width="0.35" stroke-dasharray="3 2" opacity="0.7"/>
      <text x="-2" y="88" font-size="2.6" text-anchor="middle" fill="#273e49">overview frame r 86 m; max dolly 1.55x; target (0,0)</text>

