  <rect x="8" y="8" width="278" height="246" fill="none" stroke="#273e49" stroke-width="0.65"/>

  <!-- right legend -->
  <g transform="translate(294,9)" font-size="2.75" fill="#273e49">
    <text x="0" y="5" font-size="5.2" font-weight="bold">coastal-ruins - plan v1</text>
    <text x="0" y="10">top-down synthesis; 1 unit = 1 m; drawn 2026-09-20</text>
    <text x="0" y="14">world 278 x 246 m; frame r 86 m; no implementation / GLBs</text>

    <text x="0" y="22" font-size="3.4" font-weight="bold">Palette</text>
    <rect x="0" y="24" width="5" height="3.6" fill="#e8dfc6"/><text x="7" y="27">limestone ground #e8dfc6</text>
    <rect x="0" y="29" width="5" height="3.6" fill="#b98762"/><text x="7" y="32">cliff / pedestal side #b98762</text>
    <rect x="0" y="34" width="5" height="3.6" fill="#f5efdc"/><text x="7" y="37">plaster / road core #f5efdc</text>
    <rect x="0" y="39" width="5" height="3.6" fill="#c7b894"/><text x="7" y="42">road edge / ruin stone #c7b894</text>
    <rect x="0" y="44" width="5" height="3.6" fill="#63bec6"/><text x="7" y="47">wet / shallows #63bec6</text>
    <rect x="0" y="49" width="5" height="3.6" fill="#2f7f99"/><text x="7" y="52">open water #2f7f99</text>
    <rect x="0" y="54" width="5" height="3.6" fill="#5279a5"/><text x="7" y="57">cobalt accent #5279a5</text>
    <rect x="0" y="59" width="5" height="3.6" fill="#c64b92"/><text x="7" y="62">vine #c64b92; night window #ffe9a8</text>

    <text x="0" y="70" font-size="3.4" font-weight="bold">Plan legend</text>
    <path d="M0,73 h6 v4 h-6 z" fill="#f5efdc" fill-opacity="0.75" stroke="#3d5360" stroke-width="0.35"/><text x="8" y="76.2">fixed land-shaped district catchment</text>
    <ellipse cx="3" cy="82" rx="3" ry="2.2" fill="url(#jitterHatch)" stroke="#3d5360" stroke-width="0.35" stroke-dasharray="1 1"/><text x="8" y="83">centre and yaw jitter envelope</text>
    <ellipse cx="3" cy="88" rx="3" ry="2.2" fill="none" stroke="#273e49" stroke-width="0.3" stroke-dasharray="1 1"/><text x="8" y="89">reserved open space; reject placement</text>
    <path d="M0,94 h7" stroke="#c7b894" stroke-width="2"/><text x="9" y="95">local lane / stair; no global spiral</text>
    <path d="M0,100 h7" stroke="#2f7f99" stroke-width="0.8" stroke-dasharray="2 1"/><text x="9" y="101">boat route; water remains open</text>

    <text x="0" y="109" font-size="3.4" font-weight="bold">Seed contract</text>
    <text x="0" y="113.5">terrain, coast, headland, skyline foot are fixed</text>
    <text x="0" y="117.5">sample centres in ellipses; yaw +/-16-22 deg</text>
    <text x="0" y="121.5">nearest pairs 63 / 71 / 80 / 87 m; others 90-174 m</text>
    <text x="0" y="125.5">reject overlap or any open width under 20 m</text>
    <text x="0" y="129.5">one 8-12 m anchor; support masses 3-7 m</text>
    <text x="0" y="133.5">use at least 3 refs across at least 3 districts</text>
    <text x="0" y="137.5">no repeated kit islands; no copied hero composition</text>

    <text x="0" y="145" font-size="3.4" font-weight="bold">Skyline growth; ground never grows</text>
    <text x="0" y="149.5">0% 3 shoulders, 8 m; 25% 4, 10 m; 50% 6, 13 m</text>
    <text x="0" y="153.5">75% 8, 16 m + row 2; 100% 9, 18 m + four 22 m slits</text>
    <text x="0" y="157.5">row 2 fixed 7-10 m at 146-168 m; opacity rises at 75%</text>

    <text x="0" y="165" font-size="3.4" font-weight="bold">Camera-safe horizon - 8 azimuths</text>
    <text x="0" y="169.5">N: south stacks + fog; NE: SW cape + stacks</text>
    <text x="0" y="173.5">E: west cape wall; SE: NW escarpment + row 2</text>
    <text x="0" y="177.5">S: north escarpment + row 2; SW: NE escarpment</text>
    <text x="0" y="181.5">W: east cape + stacks; NW: SE headland + stacks</text>
    <text x="0" y="185.5">pitch 39 deg; FOV 27 deg; dolly 0.72-1.55x</text>
    <text x="0" y="189.5">max camera radius 133 m; fog 118-176 m</text>
    <text x="0" y="193.5">blocker at least 8 m or 3-stack overlap each view</text>

    <text x="0" y="201" font-size="3.4" font-weight="bold">48 px anchor check</text>
    <text x="0" y="205.5">1 stair zigzag; 2 column comb; 3 triple crescents</text>
    <text x="0" y="209.5">4 broken ring; 5 L-quay; L isolated beacon block</text>
    <text x="0" y="213.5">hidden: tan coast + turquoise cove + escarpment</text>
    <text x="0" y="217.5">shown: anchors separate; no church / temple read</text>

    <text x="0" y="225" font-size="3.4" font-weight="bold">Topic mapping</text>
    <text x="0" y="229.5">topics map several-to-one; 1-5 are districts, not slots</text>
    <text x="0" y="233.5">subareas hold 2-4 pads; population uses fixed pads</text>
    <text x="0" y="237.5">L is the whole-course landmark socket on its own headland</text>
    <text x="0" y="246" fill="#766f5d">Motifs are distributed; no reference is traced wholesale.</text>
    <text x="0" y="250" fill="#766f5d">Fog and stacks close views without a circular land boundary.</text>
  </g>
</svg>
