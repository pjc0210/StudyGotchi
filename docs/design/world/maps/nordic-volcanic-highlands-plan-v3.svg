<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="2500" height="1500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fogN" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d4d8d5" stop-opacity="0"/><stop offset="1" stop-color="#d4d8d5" stop-opacity="0.96"/></linearGradient>
    <linearGradient id="fogS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d8d5" stop-opacity="0"/><stop offset="1" stop-color="#d4d8d5" stop-opacity="0.96"/></linearGradient>
    <linearGradient id="fogW" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#d4d8d5" stop-opacity="0"/><stop offset="1" stop-color="#d4d8d5" stop-opacity="0.95"/></linearGradient>
    <linearGradient id="fogE" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4d8d5" stop-opacity="0"/><stop offset="1" stop-color="#d4d8d5" stop-opacity="0.95"/></linearGradient>
    <pattern id="pasture" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(24)"><rect width="4" height="4" fill="#758366"/><rect width="0.8" height="4" fill="#8c9977"/></pattern>
    <pattern id="lava" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#34343a"/><path d="M0,1 L2,2.5 L1,5 M5,0 L3.4,2.4 L5,4" fill="none" stroke="#e05a32" stroke-width="0.55"/></pattern>
