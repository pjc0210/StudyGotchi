services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: studygotchi
      POSTGRES_PASSWORD: studygotchi
      POSTGRES_DB: studygotchi
    ports:
      - "5432:5432"
    volumes:
      - studygotchi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygotchi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studygotchi_pgdata:
