[project]
name = "studygotchi-knowledge-engine"
version = "0.1.0"
description = "StudyGotchi backend intelligence layer: course ontology, personal knowledge graph, and mastery engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "networkx>=3.4",
    "anthropic>=0.40",
    "voyageai>=0.3.1",
    "pillow>=11.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Matches the longest lines already on main so the check is about new drift, not a reformat.
line-length = 132
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
